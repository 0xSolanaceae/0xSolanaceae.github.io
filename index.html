<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>artemive</title>
    <link rel="icon" type="image/webp" href="assets/fav.webp" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <main id="stage" aria-label="Forest map with mouse-driven parallax">
        <canvas class="layer" id="layer-far"></canvas>
        <canvas class="layer" id="layer-birds-far"></canvas>
        <canvas class="layer" id="layer-leaves-far"></canvas>
        <div id="haze"></div>
        <div id="light"></div>
        <canvas class="layer" id="layer-mid-far"></canvas>
        <canvas class="layer" id="layer-land-mid"></canvas>
        <canvas class="layer" id="layer-mid-near"></canvas>
        <canvas class="layer" id="layer-land-near"></canvas>
        <canvas class="layer" id="layer-birds-near"></canvas>
        <canvas class="layer" id="layer-leaves-mid"></canvas>
        <canvas class="layer" id="layer-fore"></canvas>
        <canvas class="layer" id="layer-paper"></canvas>
        <canvas class="layer" id="layer-leaves-near"></canvas>
        <canvas class="layer" id="layer-near"></canvas>
        <div id="groundlight"></div>
        <div id="vignette"></div>
        <div id="papercard" class="closed" aria-hidden="true">
            <button id="papercard-backdrop" type="button" aria-label="Close note"></button>
            <article id="papercard-sheet">
                <canvas id="papercard-paper" aria-hidden="true"></canvas>
                <div id="papercard-content">
                    <h1 id="papercard-name"></h1>
                    <ul id="papercard-links"></ul>
                </div>
            </article>
        </div>
        <div id="loading"><div class="spinner"></div></div>
    </main>
    <script src="js/config.js"></script>
    <script src="js/util.js"></script>
    <script src="js/sprites.js"></script>
    <script src="js/pixels.js"></script>
    <script src="js/paper.js"></script>
    <script src="js/layers.js?v=2"></script>
    <script src="js/crows.js"></script>
    <script src="js/leaves.js?v=2"></script>
    <script src="js/anim.js"></script>
    <script src="js/wind.js"></script>
    <script src="js/papercard.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
